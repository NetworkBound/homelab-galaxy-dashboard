name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # scan the history, not just the tip

      - name: No credentials in the working tree
        run: |
          find . -path ./.git -prune -o -type f -print0 \
            | xargs -0 python3 .github/secretscan.py

      - name: No credentials anywhere in history
        run: |
          # Removing a secret from HEAD does not remove it from what GitHub
          # serves. Every blob ever committed is checked, because that is what
          # a clone actually hands over.
          fail=0
          for sha in $(git rev-list --objects --all | awk 'NF==2{print $1}' \
                       | git cat-file --batch-check='%(objectname) %(objecttype)' \
                       | awk '$2=="blob"{print $1}'); do
            git cat-file -p "$sha" 2>/dev/null \
              | python3 .github/secretscan.py --stdin --label "blob $sha" || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "::error::Credential found in repository history."; exit 1; }

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Lint (ruff, config in pyproject.toml)
        run: |
          python3 -m pip install -q ruff
          ruff check .

      - name: Byte-compile every module
        run: |
          python3 -m compileall -q app.py auth.py config.py pollers.py topology.py probe.py edge.py threats.py \
            showtime.py gpu_render.py demo.py setup.py addons.py addons tests deploy/lights/galaxy-lights.py \
            deploy/edge/galaxy-audience-export.py

      - name: Regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Fresh setup smoke test
        run: python3 tests/fresh_setup_smoke.py

      - name: Starts with nothing configured and offers the setup wizard
        run: |
          # With no configuration at all the app must not exit: it prints a
          # setup token and serves /setup (docs/contracts.md). Run it from an
          # empty directory so the token file and config.json land there.
          python3 - <<'PY'
          import os, subprocess, sys, tempfile, time, urllib.request
          td = tempfile.mkdtemp()
          env = {"PATH": os.environ["PATH"], "LISTEN_HOST": "127.0.0.1", "LISTEN_PORT": "18090",
                 "CONFIG_FILE": os.path.join(td, "config.json"), "DATA_DIR": td, "ENABLE_GPU": "false"}
          p = subprocess.Popen([sys.executable, os.path.abspath("app.py")], cwd=td, env=env,
                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          out, deadline = "", time.time() + 30
          try:
              while time.time() < deadline:
                  line = p.stdout.readline()
                  out += line
                  if "[setup] token:" in out and "Running on" in out:
                      break
                  if p.poll() is not None:
                      print("::error::app exited with nothing configured"); print(out[-1500:]); sys.exit(1)
              r = urllib.request.urlopen("http://127.0.0.1:18090/", timeout=5)
              assert r.geturl().endswith("/setup"), r.geturl()
              try:
                  urllib.request.urlopen("http://127.0.0.1:18090/api/setup/schema", timeout=5)
                  print("::error::setup API answered without a token"); sys.exit(1)
              except urllib.error.HTTPError as e:
                  assert e.code == 401, e.code
              assert os.stat(os.path.join(td, "setup-token")).st_mode & 0o777 == 0o600
              print("unconfigured start: token printed, / redirects to /setup, API gated")
          finally:
              p.terminate()
          PY

      - name: Demo mode boots from a fresh clone with zero configuration
        run: |
          DEMO=1 LISTEN_PORT=18091 timeout 20 python3 app.py > demo.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18091/api/config > cfg.json && break; sleep 1
          done
          python3 -c "import json; c=json.load(open('cfg.json')); assert c['demo'] and c['nodes'], c; print('demo /api/config ok:', c['brand'], [n['id'] for n in c['nodes']])"
          # the retired personal automation stack must not leak into the public API
          curl -sf http://127.0.0.1:18091/api/all | grep -q "nb""ai" && { echo '::error::retired automation keys leaked into /api/all'; exit 1; } || true
          curl -sf -o /dev/null http://127.0.0.1:18091/api/topology
          curl -sf -o /dev/null http://127.0.0.1:18091/api/threats
