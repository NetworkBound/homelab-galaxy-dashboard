name: Public repository guardrails

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan-public-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block credential leaks
        run: |
          mapfile -t files < <(git ls-files)
          python3 .github/secretscan.py "${files[@]}"

      - name: Block non-placeholder private infrastructure IPs
        run: |
          mapfile -t files < <(git ls-files)
          python3 .github/ipscan.py "${files[@]}"
