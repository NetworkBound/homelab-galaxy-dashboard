# Audience log for the Galaxy dashboard. Drop into /etc/nginx/conf.d/ on the
# origin behind your Cloudflare tunnel (or any proxy that forwards the client
# IP and country). Cloudflare puts the real visitor IP and country on every
# proxied request; nothing else on the box logs the country or the hostname, so
# unique-viewer counts come from here. A parallel log; existing logs untouched.
# Consumed by galaxy-audience-export.py (cron, every minute).
log_format galaxy '$msec $http_cf_connecting_ip $http_cf_ipcountry $host $status "$http_user_agent"';
access_log /var/log/nginx/galaxy.log galaxy;
