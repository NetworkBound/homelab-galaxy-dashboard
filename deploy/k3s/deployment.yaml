apiVersion: apps/v1
kind: Deployment
metadata:
  name: galaxy-dashboard
  namespace: galaxy
  labels:
    app.kubernetes.io/name: galaxy-dashboard
spec:
  replicas: 1                      # one writer of the slot store and metrics.db
  strategy:
    type: Recreate                 # RWO volume: never two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: galaxy-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: galaxy-dashboard
    spec:
      serviceAccountName: galaxy-dashboard
      automountServiceAccountToken: true        # k8s.py in-cluster mode reads it
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: registry.local/galaxy-dashboard:latest   # see docs/k3s.md "Build the image"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: K8S_CLUSTER_NAME
              value: "k3s"                # system label/short on both screens
            - name: K8S_POLL_S
              value: "10"
            - name: DATA_DIR              # registry slots, history, wizard config.json
              value: /var/lib/homelab-dashboard
            - name: CONFIG_FILE
              value: /var/lib/homelab-dashboard/config.json
          envFrom:
            # optional: UNIFI_USER/PASS, ZBX_USER/PASS, ... for the other pollers.
            # Create it yourself (kubectl create secret generic ...); never commit values.
            - secretRef:
                name: galaxy-dashboard-env
                optional: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/homelab-dashboard
          readinessProbe:
            httpGet:
              path: /api/k8s
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/k8s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: galaxy-dashboard-state
