# Tooling configuration only — the application is run directly, not installed
# as a package.

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["static/vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",   # line length is a judgement call in dense poller code
    "E701",   # compact `if x: y` one-liners are the house style here
    "E702",   # likewise for `a; b` in short state updates
    "SIM105", # bare try/except/pass is the poller-isolation idiom, documented
              # in README troubleshooting; contextlib.suppress hides it less well
]

[tool.ruff.lint.per-file-ignores]
# Ported test suites for the universe registry and the tour: dense table-driven
# fixtures where short lambdas, `l` loop names and printf strings read best.
"tests/test_universe.py" = ["E731", "E741", "F841", "B905", "B017", "UP031", "SIM117"]
"tests/test_tour.py" = ["UP031"]
# The k3s poller and its fixtures, kept close to how they were written.
"k8s.py" = ["UP031", "B007", "B023", "B904", "B905"]
"tests/k8s_stub.py" = ["UP031", "SIM108"]
"tests/test_k8s.py" = ["UP031", "E731"]
"tests/fixtures/k8s/make_pi_cluster.py" = ["UP031"]
