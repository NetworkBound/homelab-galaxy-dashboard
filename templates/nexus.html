<!doctype html>
<html lang="en">
<head><link rel="icon" href="data:,">
<meta charset="utf-8">
<title>Nexus</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- NEXUS: the 4K "big screen". One photographic galaxy per configured Proxmox node
     (window.CONFIG.nodes[], any number), the network core and home clients round the
     gateway, any remote sites from /api/universe, a WAN sun and THE EDGE galaxy for the
     outside world. Everything site-specific (brand, node labels/accents, sites, category
     palette, legend) arrives from GET /api/config via static/config.js and from
     /api/universe; this template contains no host name, address or brand of its own.
     Scripts: config.js -> universe_layout.js, motion.js, bodies3d.js -> nexus.js ->
     lightsync.js (publishes colour only; the wall owns the tour protocol) -> showtime.js. -->
<style>
  /* production chrome (CONTRACTS §7 / §7a). The 3D scene is the product; everything around it is quiet,
     factual monitoring UI: one family (Inter when installed), three sizes (12 / 14 / 18 px CSS at a
     1920x1080 CSS viewport, DPR 2 on a 4K panel), tabular numerals, neutral greys, colour only for status (ok / warning /
     critical) and for the category / traffic keys that also appear in the scene. No glow or gradient on text. */
  :root{--wall:#8b949e;--font:Inter,"Liberation Sans","DejaVu Sans",system-ui,sans-serif;
    --fs-s:12px;--fs-m:14px;--fs-l:18px;
    --ink:#e6edf3;--ink2:#8b949e;--ink3:#6e7681;--panel:rgba(13,17,23,.78);--line:rgba(240,246,252,.10);--line2:rgba(240,246,252,.16);
    --ok:#3fb950;--warn:#d29922;--crit:#f85149;--info:#58a6ff;--ease:cubic-bezier(.22,.61,.36,1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#02040c;overflow:hidden;cursor:none}
  body.mouse{cursor:default}
  body{font:400 var(--fs-s)/1.35 var(--font);color:var(--ink);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;display:block;transition:opacity 1.6s var(--ease)}
  /* boot veil: the scene renders behind it until every first-view asset is resident (nexus.js bootTick) */
  body.nx-boot #c{opacity:0}
  body.nx-boot .hud,body.nx-boot .panel,body.nx-boot #labels,body.nx-boot .st{opacity:0!important;transition:none!important}
  body.nx-ready .hud,body.nx-ready .panel,body.nx-ready .st{transition:opacity 1.1s var(--ease) .55s,transform .5s var(--ease)}
  body.nx-ready #labels{transition:opacity 1.2s var(--ease) .9s}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  /* scene labels: one line, short names. nexus.js owns inline transform/opacity per frame. The dark text-shadow is a
     legibility halo over bright stars, not a glow. Any per-label dimming goes on the children (inline .lbl opacity wins). */
  .lbl{position:absolute;left:0;top:0;opacity:0;transition:opacity .3s var(--ease);white-space:nowrap;line-height:1.25;
    font-size:var(--fs-s);color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8);will-change:transform}
  .lbl b{display:block;font-weight:500}
  .lbl span{display:none}
  .lbl.gal,.lbl.sun,.lbl.bridge,.lbl.planet,.lbl.grp,.lbl.flow{text-align:center}
  .lbl.gal b,.lbl.planet b{font-size:var(--fs-m);font-weight:600}
  .lbl.planet.home b{font-weight:500;color:var(--ink)}
  .lbl.sun b,.lbl.bridge b{font-weight:500}
  .lbl.grp b{font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
  .lbl.down b,.lbl.guest.down b,.lbl.guest.far.down b{color:#e5848a}
  /* lab gear: a small outlined tag after the name - a role, not a status, so no colour */
  .lbl.lab b::after{content:'LAB';display:inline-block;margin-left:5px;padding:0 3px;font-size:9px;line-height:11px;font-weight:600;
    letter-spacing:.05em;color:var(--ink2);border:1px solid rgba(154,164,177,.5);border-radius:2px;vertical-align:1px;text-shadow:none}
  /* pool labels (devices, guests, stations): a quiet backing so a name parked over a bright body stays readable */
  .lbl.guest,.lbl.station{padding:1px 5px 2px;background:rgba(10,13,18,.55);border-radius:3px}
  .lbl.guest.far b{color:var(--ink2)}
  /* traffic lanes: rate + kind, one line; the swatch is the lane's kind colour (set inline as --k) */
  .lbl.flow{padding:1px 6px 2px;background:rgba(10,13,18,.62);border-radius:3px}
  .lbl.flow b{font-weight:500;color:var(--ink)}
  .lbl.flow b::before{content:"";display:inline-block;width:10px;height:2px;border-radius:1px;background:var(--k,#c9d1dc);margin-right:6px;vertical-align:3px}
  /* leader line from an EDGE star / a parked hub name to its label: nexus.js writes translate/rotate/scaleX per frame */
  .lead{position:absolute;left:0;top:0;width:1px;height:1px;background:rgba(201,209,217,.45);transform-origin:0 50%;opacity:0;transition:opacity .3s var(--ease);will-change:transform;pointer-events:none}
  .lead.hub{background:rgba(201,209,217,.35)}
  /* ---------------- HUD ---------------- */
  .hud{position:fixed;pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
  #clock{top:20px;left:24px;font-size:var(--fs-l);font-weight:600;color:var(--ink);line-height:1.1}
  #date{top:44px;left:24px;font-size:var(--fs-s);color:var(--ink2)}
  /* problems chip: one calm line in the shared vocabulary ("Mail · SMTP down"), at most 3 + "+N more".
     A dot carries the status (red = a real outage, amber = warning, grey = lab); the chip is neutral and never wider than its
     content. Healthy = "All systems normal". It fades in and out and crossfades its content (.swap) - nothing pops (§9.4). */
  #alert{top:17px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:5px 12px 5px 11px;
    background:rgba(13,17,23,.66);border:1px solid var(--line);border-radius:13px;white-space:nowrap;opacity:0;transition:opacity .32s var(--ease),border-color .6s var(--ease)}
  #alert.on{opacity:1}
  #alert.on.swap{opacity:0}
  #alert.crit{border-color:rgba(248,81,73,.32)}
  #alert .p{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-s);color:var(--ink)}
  #alert .p i{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none}
  #alert .p.crit i{background:var(--crit)}#alert .p.warn i{background:var(--warn)}#alert .p.ok i{background:var(--ok)}
  #alert .p.ok{color:var(--ink2)}#alert .p.lab{color:var(--ink2)}
  #alert .more{font-size:var(--fs-s);color:var(--ink2)}
  @keyframes pulse{50%{opacity:.35}}
  .panel{position:fixed;pointer-events:none;width:280px;padding:9px 12px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;
    transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .panel .ph b{font-size:var(--fs-m);font-weight:600}
  .panel .ph em{font-style:normal;color:var(--ink2);white-space:nowrap}
  .panel .ph em i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink3);margin-left:4px;vertical-align:1px}
  .panel .ph em i.on{background:var(--ink)}
  .rows{transition:opacity .35s var(--ease)}
  #card-l .rows,#card-r .rows{min-height:115px}
  .rows.fade{opacity:0}
  .r{display:flex;align-items:center;gap:8px;height:23px}
  .r .k{color:var(--ink2);flex:none;width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r .v{margin-left:auto;font-size:var(--fs-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  .r .v small{font-size:var(--fs-s);color:var(--ink2)}
  .r .bar{flex:1;max-width:64px;height:4px;border-radius:2px;background:rgba(240,246,252,.08);overflow:hidden}
  .r .bar b{display:block;height:100%;background:#6e7681;border-radius:2px;transition:width .8s ease}
  .r .bar b.warn{background:var(--warn)}.r .bar b.crit{background:var(--crit)}
  .r.crit .k,.r.crit .v{color:#ff9b93}.r.crit .v{font-weight:600}
  .r.warn .v{color:#e3b341}
  .r .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
  .r.crit .dot{background:var(--crit)}.r.warn .dot{background:var(--warn)}.r.ok .dot{background:var(--ok)}
  #status{top:18px;right:24px}
  /* two node cards: the left one is the first configured node, the right one pages through every other node, so
     any number of nodes fits without a per-node rule */
  #card-l{left:24px;top:50%;transform:translateY(-50%)}
  #card-r{right:24px;top:50%;transform:translateY(-50%)}
  /* caption: the current view, plain; the dot is the wall-sync state (filled = following the wall) */
  #caption{bottom:30px;left:0;right:0;text-align:center}
  #cap{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-l);font-weight:600;color:var(--ink);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6);transition:opacity .34s var(--ease)}
  #capsub{font-size:var(--fs-s);color:var(--ink2);margin-top:3px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.85);transition:opacity .34s var(--ease)}
  /* aspect card: the caption's second line becomes one row of up to 4 facts - key small grey, value tabular, unit small */
  #capsub .facts{display:inline-flex;align-items:baseline;gap:18px}
  #capsub .f{display:inline-flex;align-items:baseline;gap:5px}
  #capsub .f em{font-style:normal;color:var(--ink2);font-size:var(--fs-s)}
  #capsub .f b{font-weight:500;color:var(--ink);font-size:var(--fs-m)}
  #capsub .f small{color:var(--ink2);font-size:var(--fs-s)}
  #capsub .f.warn b{color:#e3b341}#capsub .f.crit b{color:#ff9b93}
  #sync{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink3);flex:none}
  #sync.on{background:var(--ok);border-color:var(--ok)}
  #sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  body.nx-threat #cap{color:#ff9b93}
  body.nx-audience #cap{color:var(--ink)}
  /* event cutaways (a body down / back / new): only an outage takes the status colour */
  body.nx-evdown #cap{color:#ff9b93}
  body.nx-event #cap{color:var(--ink)}
  #legend{bottom:20px;left:24px;max-width:600px;color:var(--ink2);display:flex;flex-direction:column;gap:5px}
  #legend .lg{display:flex;gap:12px;align-items:center;white-space:nowrap;flex-wrap:wrap}
  #legend .lg>em{font-style:normal;color:var(--ink3);width:46px}
  #legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
  #legend i.ln{width:12px;height:2px;border-radius:1px;vertical-align:3px}
  #legend .tr{display:none}
  body.nx-over #legend .tr.has{display:flex}
  #legend .note{color:var(--ink3);padding-left:58px}
  #updated{bottom:20px;right:24px;color:var(--ink3)}
  /* detail card: one clean card for a clicked / tapped body; closes on an empty click or after 12 s */
  #detail{width:300px;display:none;pointer-events:auto;z-index:9;background:rgba(13,17,23,.95);border-color:var(--line2)}
  #detail.on{display:block}
  #detail .r .k{width:84px}
  #detail .r .v{font-size:var(--fs-s);color:var(--ink)}
  #detail .ph b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  #pick{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px solid rgba(230,237,243,.8);border-radius:50%;pointer-events:none;display:none;z-index:8}
  #pick.on{display:block}
  /* showtime.js chrome on this screen: its LIVE timecode pill and showcase brackets are decoration (§7a), and its
     alert banner is replaced by #alert above (nexus.js folds the backend's alert reason into it) */
  html body #st-live,html body #st-frame,html body #st-alert{display:none!important}
  /* one static composited layer: scrims under the top/bottom chrome (the text's backing) and a light corner vignette
     (light: the scene's own grade carries a photographic vignette, and the wide shots fill the frame to the corners) */
  #vig{position:fixed;inset:0;pointer-events:none;transition:opacity .8s var(--ease);
    background:linear-gradient(180deg,rgba(2,4,12,.45) 0,rgba(2,4,12,0) 9vh),
               linear-gradient(0deg,rgba(2,4,12,.5) 0,rgba(2,4,12,0) 12vh),
               radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.2) 100%)}
  /* while the camera travels, the side panels dim to ~35 % (eased) and return at the hold; the caption stays */
  body.nx-leg .panel,body.nx-leg #legend{opacity:.35}
  /* showtime modes (body classes from showtime.js) */
  body.st-night .panel,body.st-night #legend{opacity:.6}
  body.st-night .lbl>*{opacity:.6}
  body.st-showcase .panel{opacity:0}
  /* the playthrough: letterbox bars + chapter progress, clean of every other HUD element (compositor-only) */
  .letterbox{position:fixed;left:0;right:0;height:8.5vh;background:#000;transform:scaleY(0);transition:transform .8s var(--ease);z-index:6;pointer-events:none;will-change:transform}
  .letterbox.top{top:0;transform-origin:50% 0}.letterbox.bottom{bottom:0;transform-origin:50% 100%}
  body.nx-showcase .letterbox{transform:scaleY(1)}
  #scprog{position:fixed;left:24px;right:24px;bottom:1.6vh;height:2px;background:rgba(240,246,252,.12);border-radius:1px;overflow:hidden;opacity:0;transition:opacity .8s;z-index:7}
  #scprog i{display:block;height:100%;width:100%;background:var(--ink2);transform-origin:left center;transform:scaleX(0)}
  body.nx-showcase #scprog{opacity:1}
  body.nx-showcase #vig{opacity:.6}
  body.nx-showcase .panel,body.nx-showcase #clock,body.nx-showcase #date,body.nx-showcase #legend,body.nx-showcase #updated,body.nx-showcase #alert{opacity:0;transition:opacity .6s var(--ease)}
  body.nx-showcase #caption{bottom:calc(8.5vh + 14px)}
</style>
</head>
<body class="nx-boot">
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="labels"></div>
<div id="pick"></div>
<div id="lbt" class="letterbox top"></div><div id="lbb" class="letterbox bottom"></div>
<div id="scprog"><i id="scbar"></i></div>
<div id="clock" class="hud">--:--:--</div>
<div id="date" class="hud">—</div>
<div id="alert" class="hud"></div>
<div id="status" class="panel"><div class="ph"><b>Estate</b><em id="status-m">—</em></div><div class="rows" id="status-rows"></div></div>
<div id="card-l" class="panel"></div>
<div id="card-r" class="panel"></div>
<div id="caption" class="hud"><div id="cap"><i id="sync" class="off"><span>free roam</span></i><span id="captxt">Overview</span></div><div id="capsub">—</div></div>
<!-- filled from CONFIG.categories + CONFIG.palette below; the traffic rows by nexus.js -->
<div id="legend" class="hud">
  <div class="lg" id="legend-g"><em>Guests</em></div>
  <div class="lg tr" id="legend-tr"><em>Traffic</em></div>
  <div class="lg tr note" id="legend-tr2">Lane width = rate (log scale) · two lanes = each direction measured</div>
</div>
<div id="updated" class="hud"></div>
<div id="detail" class="panel"></div>

<script src="/static/config.js?v=2"></script>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/CopyShader.js"></script>
<script src="/static/vendor/LuminosityHighPassShader.js"></script>
<script src="/static/vendor/EffectComposer.js"></script>
<script src="/static/vendor/RenderPass.js"></script>
<script src="/static/vendor/ShaderPass.js"></script>
<script src="/static/vendor/UnrealBloomPass.js"></script>
<script>
(function(){
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function tick(){var d=new Date(),p=function(n){return (n<10?'0':'')+n};
    document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    document.getElementById('date').textContent=DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
  tick();setInterval(tick,1000);
})();
</script>
<script>window.LIGHTSYNC_SRC='nexus';window.LIGHTSYNC_TOUR=false;</script>
<script>/* one /api/pulse/stream per page: nexus.js opens it at the reveal and re-broadcasts each beat as 'nb:pulse', so
   showtime.js listens to that instead of opening a second socket (browsers allow 6 per host) */
window.NB_PULSE_SHARED=true;</script>
<script>
/* Identity first: nexus.js reads window.CONFIG synchronously at load, so the
   scene modules are only appended once GET /api/config has answered. */
(function () {
  function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  window.loadConfig().then(function (C) {
    document.title = C.brand + ' · nexus';
    /* the legend is the configured category palette, plus the stopped colour */
    var lg = document.getElementById('legend-g');
    if (lg) {
      lg.innerHTML = '<em>Guests</em>' + C.categories.map(function (k) {
        var h = C.palette[k] || '#8fb0d0';
        return '<span><i style="background:' + esc(h) + '"></i>' + esc(C.catName ? C.catName(k) : k) + '</span>';
      }).join('') +
      '<span><i style="background:' + esc(C.palette.stopped) + '"></i>Stopped</span>';
    }
    document.body.classList.toggle('no-cameras', !C.features.cameras);
    document.body.classList.toggle('no-audience', !C.features.audience);
    window.loadScripts([
      '/static/universe_layout.js?v=2',
      '/static/motion.js?v=2',
      '/static/bodies3d.js?v=5',
      '/static/nexus.js?v=60',
      '/static/lightsync.js?v=16',
      '/static/showtime.js?v=8'
    ]);
  });
})();
</script>
</body>
</html>
